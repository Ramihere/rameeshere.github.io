<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin Login</title>

<style>
body{
    background:#020617;
    color:white;
    font-family:Arial;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.box{
    background:#0f172a;
    padding:30px;
    border-radius:10px;
    width:320px;
}

input,button{
    width:100%;
    padding:10px;
    margin-top:10px;
    border:none;
    border-radius:5px;
}

button{
    background:#38bdf8;
    cursor:pointer;
}

#error{
    color:red;
}

</head>

<body>

<div class="box">
<h2>Admin Login</h2>

<input type="text" id="user" placeholder="Username">
<input type="password" id="pass" placeholder="Password">

<button onclick="login()">Login</button>

<p id="error"></p>
</div>

<script>
function login(){
    let u=document.getElementById("user").value;
    let p=document.getElementById("pass").value;

    if(u==="admin" && p==="ctf123"){
        document.body.innerHTML="<h1 style='text-align:center;'>😂 Bro don't waste your time!<br><br>Go study hard, focus on your career 💪🔥</h1>";
    } else {
        document.getElementById("error").innerText="Invalid credentials";
    }
}
</script>

</body>
